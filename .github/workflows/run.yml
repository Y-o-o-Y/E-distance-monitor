name: Auto Update Quant Dashboard

on:
  # 1. 保留手動觸發（可傳入特定標的）
  workflow_dispatch:
    inputs:
      ticker_input:
        description: '要計算的個股 Ticker'
        required: false
        default: 'MU'

  # 2. 新增定時排程 (例如：台北時間每天早上 6:00 / UTC 22:00 執行)
  schedule:
    - cron: '0 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance numpy pandas plotly

    - name: Run calculation script
      run: |
        # 若是排程觸發，ticker_input 會是空的，在 Bash 賦予預設值 'MU'
        TICKER="${{ github.event.inputs.ticker_input }}"
        if [ -z "$TICKER" ]; then
          TICKER="MU"
        fi
        python update_dashboard.py "$TICKER"

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Auto update dashboard"
        git push
